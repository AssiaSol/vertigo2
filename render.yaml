# Render Blueprint — forces a Docker build of the .NET 10 API and ignores the
# root package.json (which otherwise makes Render guess a Node build → status 127).
# Deploy via Render → New + → Blueprint → pick this repo. Render reads this file.
services:
  - type: web
    name: vertigo-api
    runtime: docker
    # Paths are relative to the REPO ROOT. Don't use rootDir here — combining it
    # with a Docker build makes Render append a stray "/src" to the context path
    # (lstat .../Vertigo/Vertigo/src: no such file or directory).
    dockerfilePath: ./src/backend/Vertigo/Vertigo/Dockerfile
    dockerContext: ./src/backend/Vertigo/Vertigo
    plan: free
    envVars:
      # Values are entered in the Render dashboard (sync:false keeps secrets out of git).
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
